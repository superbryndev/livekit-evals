name: Publish to PyPI

# The version in pyproject.toml is the single source of truth. This workflow
# never bumps it: main is protected, so CI cannot push a bump commit back. It
# publishes the declared version if (and only if) it is not already on PyPI and
# has a matching CHANGELOG entry. To release, bump the version in the PR
# (`bump2version patch|minor|major` keeps pyproject.toml and __init__.py in
# lockstep), add the CHANGELOG section, and merge to main.

on:
  push:
    branches:
      - main
    paths:
      - 'livekit_evals/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'README.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Resolve declared version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Declared version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          INIT_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('livekit_evals/__init__.py').read()).group(1))")
          if [ "$VERSION" != "$INIT_VERSION" ]; then
            echo "::error::pyproject.toml ($VERSION) and livekit_evals/__init__.py ($INIT_VERSION) disagree"
            exit 1
          fi

      - name: Check whether version is already on PyPI
        id: pypi
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/livekit-evals/$VERSION/json")
          if [ "$STATUS" = "200" ]; then
            echo "Version $VERSION already published, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "Version $VERSION not on PyPI, will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PyPI lookup for $VERSION returned HTTP $STATUS"
            exit 1
          fi

      - name: Require matching CHANGELOG entry
        if: steps.pypi.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section, add one before releasing"
            exit 1
          fi

      - name: Build package
        if: steps.pypi.outputs.publish == 'true'
        run: |
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: steps.pypi.outputs.publish == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
